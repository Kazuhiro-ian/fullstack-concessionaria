<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concessionária - Gestão de Clientes</title>
    <link rel="stylesheet" href="clientes.css"> </head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html">Veículos</a>
            <a href="clientes.html" class="active">Clientes</a>
        </nav>
        <h1>Gestão de Clientes</h1>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Cadastrar Novo Cliente</h2>
            <form id="form-cliente">
                <div class="input-group">
                    <input type="text" id="nome" placeholder="Nome Completo" required>
                    <input type="text" id="cpf" placeholder="CPF (Apenas números)" required maxlength="11">
                    <input type="email" id="email" placeholder="E-mail" required>
                </div>
                <button type="submit" class="btn-save">Salvar Cliente</button>
            </form>
        </section>

        <hr>

        <section class="table-section">
            <h2>Lista de Clientes</h2>
            <table id="tabela-clientes">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </main>

    <script src="clientes.js"></script>
</body>
</html>
