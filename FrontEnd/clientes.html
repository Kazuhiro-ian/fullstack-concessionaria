<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concessionária - Gestão de Clientes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="clientes.css"> 
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="nav-container">
                <span class="logo">🚗 AutoGestão</span>
                <div class="nav-links">
                    <a href="veiculos.html">Veículos</a>
                    <a href="clientes.html" class="active">Clientes</a>
                    <a href="funcionarios.html">Funcionários</a>
                    <a href="vendas.html">Vendas</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        
        <div class="page-header">
            <h1>Gestão de Clientes</h1>
            <p>Gerencie o cadastro e os dados de contato dos clientes.</p>
        </div>

        <section class="card-section">
            <h2 class="section-title">Cadastrar Novo Cliente</h2>
            <form id="form-cliente">
                <div class="input-grid">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="input-group">
                        <label for="cpf">CPF (Somente números)</label>
                        <input type="text" id="cpf" placeholder="Ex: 12345678900" required maxlength="11">
                    </div>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Ex: joao@email.com" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar Cliente</button>
                </div>
            </form>
        </section>

        <section class="card-section">
            <h2 class="section-title">Clientes Cadastrados</h2>
            <div class="search-container">
                <div class="input-group">
                    <input type="text" id="input-busca" placeholder="Pesquisar por nome, CPF ou e-mail..." onkeyup="filtrarTabela()">
                </div>
            </div>
            <div class="table-responsive">
                <table class="data-table" id="tabela-clientes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="clientes.js"></script>
</body>
</html>
