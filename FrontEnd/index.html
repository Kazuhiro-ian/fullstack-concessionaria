<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concessionária FullStack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🚗 Gestão de Estoque</h1>

    <div class="form-container">
        <h2>Cadastrar Novo Veículo</h2>
        <form id="form-veiculo">
            <input type="text" id="marca" placeholder="Marca" required>
            <input type="text" id="modelo" placeholder="Modelo" required>
            <input type="number" id="ano" placeholder="Ano" required>
            <input type="number" step="0.01" id="preco" placeholder="Preço" required>
            <input type="text" id="placa" placeholder="Placa (Ex: ABC1D23)" required>
            <button type="submit">Salvar Veículo</button>
        </form>
    </div>
    
    <table id="tabela-veiculos">
        <thead>
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Preço</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
